<script>
(function () {
  'use strict';
  var state = { token: null, me: null, route: 'boot', params: {}, tmp: {} };
  var app = document.getElementById('app');

  /* ---------- utilitários ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) { reject(new Error(cleanErr(e))); });
      r[fn].apply(r, args);
    });
  }
  function cleanErr(e) { var m = (e && e.message) || String(e); return m.replace(/^Error:\s*/, ''); }
  function store(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function fmtData(ms) { return ms ? new Date(ms).toLocaleDateString('pt-PT') : ''; }
  function fmtQuando(ms) {
    var d = Date.now() - ms, m = Math.round(d / 60000);
    if (m < 1) return 'agora'; if (m < 60) return 'há ' + m + ' min';
    var h = Math.round(m / 60); if (h < 24) return 'há ' + h + ' h';
    var dd = Math.round(h / 24); return dd < 30 ? 'há ' + dd + (dd === 1 ? ' dia' : ' dias') : fmtData(ms);
  }
  function deviceName() {
    var u = navigator.userAgent;
    var b = /Edg\//.test(u) ? 'Edge' : /Chrome\//.test(u) ? 'Chrome' : /Firefox\//.test(u) ? 'Firefox' : /Safari\//.test(u) ? 'Safari' : 'Browser';
    var o = /Android/.test(u) ? 'Android' : /iPhone|iPad/.test(u) ? 'iOS' : /Windows/.test(u) ? 'Windows' : /Mac/.test(u) ? 'Mac' : /Linux/.test(u) ? 'Linux' : '';
    return b + (o ? ' · ' + o : '');
  }
  function toast(msg, erro) {
    var t = document.createElement('div'); t.className = 'toast' + (erro ? ' erro' : ''); t.setAttribute('role', 'status'); t.textContent = msg;
    document.body.appendChild(t); setTimeout(function () { t.remove(); }, erro ? 5000 : 2800);
  }
  function busy(btn, on) { if (btn) { btn.disabled = on; } }
  function go(route, params) { state.route = route; state.params = params || {}; render(); window.scrollTo(0, 0); }

  /** Janela de pergunta. fields: [{name,label,type,value,placeholder}] -> Promise(valores | null) */
  function ask(title, text, fields, okLabel, perigo) {
    return new Promise(function (resolve) {
      var o = document.createElement('div'); o.className = 'overlay';
      o.innerHTML = '<div class="folha" role="dialog" aria-modal="true" aria-label="' + esc(title) + '"><h3>' + esc(title) + '</h3>' +
        (text ? '<p class="suave">' + esc(text) + '</p>' : '') +
        fields.map(function (f) { if (f.options) return '<label>' + esc(f.label) + '<select name="' + esc(f.name) + '">' + f.options.map(function (o) { return '<option' + (o === f.value ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select></label>'; if (f.type === 'file') return '<label>' + esc(f.label) + '<input name="' + esc(f.name) + '" type="file" accept="application/pdf,image/jpeg,image/png,image/webp"></label>'; return '<label>' + esc(f.label) + '<input name="' + esc(f.name) + '" type="' + (f.type || 'text') + '" value="' + esc(f.value || '') + '" placeholder="' + esc(f.placeholder || '') + '" autocomplete="off"></label>'; }).join('') +
        '<div class="linha"><button class="btn ghost" data-x>Cancelar</button><button class="btn ' + (perigo ? 'perigo' : '') + '" data-ok>' + esc(okLabel || 'Confirmar') + '</button></div></div>';
      document.body.appendChild(o);
      var first = o.querySelector('input'); if (first) first.focus();
      function close(v) { o.remove(); resolve(v); }
      o.querySelector('[data-x]').onclick = function () { close(null); };
      o.onclick = function (e) { if (e.target === o) close(null); };
      o.querySelector('[data-ok]').onclick = function () {
        var v = {}; Array.prototype.forEach.call(o.querySelectorAll('input,select'), function (i) { v[i.name] = i.type === 'file' ? (i.files && i.files[0] || null) : i.value.trim(); }); close(v);
      };
    });
  }

  /** Executa uma ação do servidor com tratamento de erro; devolve true se correu bem. */
  async function acao(btn, fn, okMsg) {
    busy(btn, true);
    try { var r = await fn(); if (okMsg) { toast(okMsg); limparCache(); } return r === undefined ? true : r; }
    catch (e) {
      if (/Sess[ãa]o expirada/.test(e.message)) { sair(true); }
      toast(e.message, true); return false;
    } finally { busy(btn, false); }
  }

  function sair(silencioso) {
    store('token', null); state.token = null; state.me = null; limparCache();
    if (!silencioso) toast('Sessão terminada');
    go('entrar');
  }

  /* ---------- estrutura ---------- */
  var ICONES = {
    inicio: '<path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/>',
    fracoes: '<rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M10 21v-4h4v4"/>',
    menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
    avisos: '<path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15L6 17z"/><path d="M10 21h4"/>',
    pedidos: '<path d="M16 11a4 4 0 1 0-8 0"/><path d="M4 20c0-3.3 3.6-6 8-6s8 2.7 8 6"/><path d="M19 4v4M17 6h4"/>',
    dispositivos: '<rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/>',
    pagamentos: '<circle cx="12" cy="12" r="9"/><path d="M15 9c-.6-.8-1.6-1.2-2.8-1.2-1.7 0-3 1-3 2.6 0 3.2 6 1.4 6 4.4 0 1.5-1.3 2.4-3 2.4-1.3 0-2.4-.5-3-1.4M7.5 12h6"/>',
    obras: '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3.5 17.3a1.8 1.8 0 0 0 2.5 2.5l5.8-5.8a4 4 0 0 0 5.2-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>',
    resumo: '<path d="M5 20V10M12 20V4M19 20v-7"/>',
    escudo: '<path d="M12 3l8 3v6c0 4.5-3.2 7.8-8 9-4.8-1.2-8-4.5-8-9V6l8-3z"/>',
    recibo: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z"/><path d="M9 8h6M9 12h6"/>',
    mail: '<path d="M3 6h18v12H3z"/><path d="M3 7l9 7 9-7"/>',
    enviar: '<path d="M3 11l18-8-8 18-2-8-8-2z"/>',
    cadeado: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
    doc: '<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/>',
    sair: '<path d="M10 4H5v16h5M15 8l4 4-4 4M19 12H9"/>'
  };
  function svg(n) { return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONES[n] + '</svg>'; }

  function barra(ativa) {
    var m = state.me; if (!m) return '';
    var tabs = m.isMaster
      ? [['inicio', 'Início', 'inicio'], ['avisos', 'Avisos', 'avisos'], ['sair', 'Sair', 'sair']]
      : [['inicio', 'Início', 'inicio'], ['fracoes', 'Frações', 'fracoes'], ['pagamentos', 'Pagamentos', 'pagamentos'], ['obras', 'Obras', 'obras'], ['resumo', 'Resumo', 'resumo']];
    return '<nav class="barra" aria-label="Navegação">' + tabs.map(function (t) {

  function lerFicheiro(file) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve({ nome: file.name, mime: file.type, base64: String(r.result).split(',')[1] || '' }); };
      r.onerror = function () { reject(new Error('Não consegui ler o ficheiro.')); };
      if (/^image\/(jpeg|png|webp)$/.test(file.type) && window.createImageBitmap) {
        // fotos: reduz no telemóvel (lado maior 1600 px, JPEG) para ficar com ~300 KB
        createImageBitmap(file).then(function (img) {

  async function registarPagamento(ano, mes) {
    var m = state.me, letras = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
    var v = await ask('Registar pagamento', 'O comprovativo é opcional (PDF ou foto; as fotos são reduzidas automaticamente).', [
      { name: 'letra', label: 'Fração', options: m.isAdmin ? letras : [m.fracao], value: m.fracao || 'A' },
      { name: 'data', label: 'Data do pagamento', type: 'date', value: hojeISO() },
      { name: 'valor', label: 'Valor total (€)', placeholder: 'Ex.: 50,00' },
      { name: 'mes', label: 'Primeiro mês pago', type: 'month', value: ano + '-' + ('0' + mes).slice(-2) },
      { name: 'n', label: 'Número de meses', type: 'number', value: '1' },
      { name: 'metodo', label: 'Forma de pagamento', options: ['Transferência', 'MB Way', 'Numerário', 'Cheque', 'Outro'] },
      { name: 'notas', label: 'Notas (opcional)' },
      { name: 'ficheiro', label: 'Comprovativo (opcional)', type: 'file' }
    ], 'Registar');
    if (!v) return;
    var ok = await acao(null, async function () {
      var f = v.ficheiro ? await lerFicheiro(v.ficheiro) : null;
      return call('api_addPayment', state.token, v.letra, v.data, v.valor, v.mes, Number(v.n), v.metodo, v.notas, f);
    }, 'Pagamento registado');
    if (ok) ecraPagamentos();
  }

  /* ---------- Convocatória ---------- */
  async function ecraConvocatoria() {
    var F = state.tmp.conv = state.tmp.conv || { assunto: '', reuniao: '', file: null };
    state.volta = { r: 'administracao', p: {} };
    carregar('conv', 'api_convocatoriaInfo', [], function (c) {
      var kb = F.file ? Math.max(1, Math.round(F.file.size / 1024)) + ' KB · pronto a enviar' : '';
      vista('<main>' + voltarBtn('Administração') + '<header><h1>' + (c.souAdmin ? 'Nova convocatória' : 'Convocatórias') + '</h1><p class="suave" style="margin-top:4px">' + (c.souAdmin ? 'Carrega o documento e a app envia por email a todas as frações.' : 'Só os administradores enviam. Aqui vês o que já foi enviado.') + '</p></header>' +
        (c.souAdmin ? '<section class="cartao" style="gap:12px"><label>Assunto<input id="assunto" placeholder="Assembleia de condóminos 2026" value="' + esc(F.assunto) + '"></label>' +
          '<label><span>Reunião <span class="pequeno" style="font-weight:500">(data, hora e local · opcional)</span></span><input id="reuniao" placeholder="12/12 às 19h, hall do prédio" value="' + esc(F.reuniao) + '"></label>' +
          '<div style="display:flex;flex-direction:column;gap:5px"><span style="font-size:13px;font-weight:700">Documento da convocatória (PDF)</span><input id="pdf" type="file" accept="application/pdf" hidden>' +
          (F.file ? '<div class="faixa" style="border-radius:12px"><div class="tile" style="width:38px;height:38px;background:var(--verde);color:#fff">' + svg('doc') + '</div><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:700;word-break:break-all">' + esc(F.file.name) + '</div><div style="font-size:12px;color:#0B4F4A">' + kb + '</div></div><button class="btn ghost peq" id="trocar" style="background:#fff">Trocar</button></div>'
            : '<button class="btn ghost" id="trocar" style="border-style:dashed;height:56px">Escolher PDF</button>') + '</div></section>' +
          '<div class="cartao" style="flex-direction:row;align-items:center"><span style="color:#0B5A54;flex:none">' + svg('mail') + '</span><div style="flex:1;font-size:13px;line-height:1.35"><strong>' + c.nEmails + ' emails em ' + c.nFracoes + ' frações</strong><br><span class="suave">Respostas vão para ' + esc(state.me.email) + '</span></div><button class="lnk" id="lista" style="font-weight:700">Ver lista</button></div>' +
          '<button class="btn ambar" id="enviar" style="display:flex;align-items:center;justify-content:center;gap:8px">' + svg('enviar') + 'Enviar a todas as frações</button>' : '') +
        '<section class="cartao" style="padding:12px 14px;gap:0"><h2 style="font-size:14px;margin-bottom:4px">Convocatórias enviadas</h2>' +
        (c.historico.length ? c.historico.map(function (h) { return '<div style="padding:8px 0;border-top:1px solid #EFE9DD"><div style="font-size:14px;font-weight:700">' + esc(h.assunto) + '</div><div class="pequeno" style="margin-top:2px;line-height:1.35">' + fmtData(h.data) + ' · enviada por ' + esc(h.enviadoPor) + (h.fracao ? ' (fração ' + esc(h.fracao) + ')' : '') + ' · ' + h.n + ' emails · PDF anexado</div></div>'; }).join('') : '<div class="pequeno" style="border-top:1px solid #EFE9DD;padding-top:6px">Ainda não foi enviada nenhuma convocatória.</div>') + '</section>' +
        '<p class="pequeno">Nota: o email só vale como convocatória para quem o aceitou em ata, e convém que cada condómino confirme a receção.</p></main>', 'inicio');
      ligarGo();
      if (!c.souAdmin) return;
      var guardar = function () { F.assunto = document.getElementById('assunto').value; F.reuniao = document.getElementById('reuniao').value; };
      var pdf = document.getElementById('pdf');
      document.getElementById('trocar').onclick = function () { guardar(); pdf.click(); };
      pdf.onchange = function () { if (pdf.files[0]) { F.file = pdf.files[0]; ecraConvocatoria(); } };
      document.getElementById('lista').onclick = function () {
        folha('Destinatários', '<div style="max-height:50vh;overflow:auto;display:flex;flex-direction:column;gap:6px">' + c.emails.map(function (e) { return '<div class="linha" style="font-size:14px"><span class="chip verde" style="min-width:26px;text-align:center">' + esc(e.fracao) + '</span><span class="mail" style="font-size:14px;font-weight:600">' + esc(e.email) + '</span></div>'; }).join('') + '</div><button class="btn ghost" data-x>Fechar</button>',
          function (o, fechar) { o.querySelector('[data-x]').onclick = fechar; });
      };
      document.getElementById('enviar').onclick = async function () {
        guardar();
        var b = this;
        if (!F.file) return toast('Carrega o PDF da convocatória.', true);
        var ok = await ask('Enviar a ' + c.nEmails + ' emails?', 'Não se pode desfazer. Fica registado quem enviou e para que emails.', [], 'Enviar', false);
        if (!ok) return;
        var r = await acao(b, async function () { var f = await lerFicheiro(F.file); return call('api_sendConvocatoria', state.token, F.assunto, F.reuniao, f); }, 'Convocatória enviada');
        if (r) { state.tmp.conv = null; ecraConvocatoria(); }
      };
    });
  }

  /* ---------- Obras e problemas ---------- */
  var filtroObras = { obras: 'Todas', problemas: 'Abertos' };
  async function ecraObras() {
    var tab = state.params.tab === 'problemas' ? 'problemas' : 'obras';
    var fn = tab === 'obras' ? 'api_obras' : 'api_problemas';
    carregar(tab, fn, [], function (lista) {
      var f = filtroObras[tab], chips, cards;
      if (tab === 'obras') {
        chips = ['Todas', 'Em curso', 'Concluídas'];
        var vis = lista.filter(function (o) { return f === 'Todas' || (f === 'Em curso' ? o.estado === 'Em curso' : o.estado === 'Concluída'); });
        cards = vis.map(function (o) {
          var ok = o.estado === 'Concluída';
          return '<button class="art" data-id="' + esc(o.id) + '"><div class="linha" style="justify-content:space-between;align-items:flex-start;gap:10px"><h2 style="font-size:16px;line-height:1.25;text-align:left">' + esc(o.titulo) + '</h2>' + pill(o.estado, ok ? '#DCF3E3' : '#FDF0D2', ok ? '#14622F' : '#6B4200') + '</div>' +
            '<div class="suave" style="font-size:13px;text-align:left">' + (ok && o.fim ? 'Concluída em ' + fmtMesCurto(new Date(o.fim).getFullYear() + '-' + ('0' + (new Date(o.fim).getMonth() + 1)).slice(-2)) + ' · ' + haTempo(o.fim) : (o.inicio ? 'Iniciada em ' + fmtData(o.inicio) + ' · ' + haTempo(o.inicio) : '')) + '</div>' +
            '<div class="linha" style="gap:14px;font-size:13px;font-weight:600"><span>' + (o.custo == null ? 'Custo por indicar' : eur(o.custo)) + '</span><span class="suave" style="font-weight:500">' + o.docs + (o.docs === 1 ? ' documento' : ' documentos') + '</span></div>' +
            '<span class="gar">' + (o.garantia ? 'Garantia até ' + fmtMesCurto(o.garantia) : 'Garantia a definir') + '</span></button>';
        }).join('');
      } else {
        chips = ['Abertos', 'Em tratamento', 'Resolvidos'];
        var cont = lista.filter(function (p) { return p.estado === 'Aberto'; }).length;
        var alvo = f === 'Abertos' ? 'Aberto' : (f === 'Em tratamento' ? 'Em tratamento' : 'Resolvido');
        cards = lista.filter(function (p) { return p.estado === alvo; }).map(function (p) {
          return '<button class="art" data-id="' + esc(p.id) + '"><div class="linha" style="justify-content:space-between;align-items:flex-start;gap:10px"><h2 style="font-size:16px;line-height:1.25;text-align:left">' + esc(p.titulo) + '</h2>' + pill(p.prioridade, PRIO[p.prioridade][0], PRIO[p.prioridade][1]) + '</div>' +
            '<div class="suave" style="font-size:13px;text-align:left">' + esc(p.local) + '</div><div class="linha" style="justify-content:space-between;font-size:12px;color:var(--suave)"><span>Reportado pela fração ' + esc(p.fracao) + ' · ' + haTempo(p.data) + '</span><strong style="color:#1F2937;white-space:nowrap">' + (p.comentarios ? p.comentarios + (p.comentarios === 1 ? ' comentário' : ' comentários') : 'Sem comentários') + '</strong></div></button>';
        }).join('');
        chips[0] = 'Abertos';
        state.tmp.nAbertos = cont;
      }
      vista('<main><header><h1>Obras e problemas</h1><p class="suave" style="margin-top:4px">' + (tab === 'obras' ? 'O que foi feito, quando e há quanto tempo.' : 'Coisas a considerar e a tratar no prédio.') + '</p></header>' +
        '<div class="seg"><button data-tab="obras" aria-pressed="' + (tab === 'obras') + '">Obras</button><button data-tab="problemas" aria-pressed="' + (tab === 'problemas') + '">Problemas</button></div>' +
        '<div class="linha" style="flex-wrap:wrap;gap:8px">' + chips.map(function (c) { return '<button class="filtro" data-fil="' + esc(c) + '" aria-pressed="' + (c === f) + '">' + esc(c) + (tab === 'problemas' && c === 'Abertos' ? ' · ' + state.tmp.nAbertos : '') + '</button>'; }).join('') + '</div>' +
        '<div style="display:flex;flex-direction:column;gap:10px">' + (cards || '<div class="nota"><span>Nada para mostrar aqui.</span></div>') + '</div>' +
        '<button class="btn ambar" id="novo" style="margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px">' + MAIS + (tab === 'obras' ? 'Registar obra' : 'Reportar problema') + '</button></main>', 'obras');
      ligarGo();
      Array.prototype.forEach.call(document.querySelectorAll('[data-tab]'), function (b) { b.onclick = function () { go('obras', { tab: b.getAttribute('data-tab') }); }; });
      Array.prototype.forEach.call(document.querySelectorAll('[data-fil]'), function (b) { b.onclick = function () { filtroObras[tab] = b.getAttribute('data-fil'); ecraObras(); }; });
      Array.prototype.forEach.call(document.querySelectorAll('[data-id]'), function (b) { b.onclick = function () { var x = lista.filter(function (i) { return i.id === b.getAttribute('data-id'); })[0]; if (tab === 'obras') abrirObra(x); else abrirProblema(x); }; });
      document.getElementById('novo').onclick = tab === 'obras' ? novaObra : novoProblema;
    });
  }

  async function novaObra() {
    var v = await ask('Registar obra', 'Todos veem as obras. Podes juntar orçamentos e faturas depois.', [
      { name: 'titulo', label: 'Título', placeholder: 'Ex.: Reparação do telhado' }, { name: 'descricao', label: 'Descrição (opcional)' }, { name: 'fornecedor', label: 'Fornecedor (opcional)' },
      { name: 'inicio', label: 'Data de início', type: 'date', value: hojeISO() }, { name: 'custo', label: 'Custo (€, opcional)' }, { name: 'garantia', label: 'Garantia até (opcional)', type: 'month' },
      { name: 'ficheiro', label: 'Documento (opcional)', type: 'file' }], 'Registar');
    if (!v) return;
    if (await acao(null, async function () { var f = v.ficheiro ? await lerFicheiro(v.ficheiro) : null; return call('api_addObra', state.token, v.titulo, v.descricao, v.fornecedor, v.inicio, v.custo, v.garantia, f); }, 'Obra registada')) ecraObras();
  }
  async function novoProblema() {
    var v = await ask('Reportar problema', 'Todos veem e podem comentar.', [
      { name: 'titulo', label: 'O que se passa?', placeholder: 'Ex.: Luz da escada fundida' }, { name: 'local', label: 'Onde?', placeholder: 'Ex.: 2º andar · escada' },
      { name: 'descricao', label: 'Mais detalhes (opcional)' }, { name: 'prioridade', label: 'Prioridade', options: ['Alta', 'Média', 'Baixa'], value: 'Média' }], 'Reportar');
    if (!v) return;
    if (await acao(null, function () { return call('api_addProblema', state.token, v.titulo, v.descricao, v.local, v.prioridade); }, 'Problema reportado')) ecraObras();
  }

  function abrirObra(o) {
    folha(o.titulo, '<div style="display:flex;flex-direction:column;gap:6px;font-size:14px">' + (o.descricao ? '<p>' + esc(o.descricao) + '</p>' : '') +
      (o.fornecedor ? '<div class="suave">Fornecedor: ' + esc(o.fornecedor) + '</div>' : '') + '<div class="suave">' + (o.custo == null ? 'Custo por indicar' : eur(o.custo)) + ' · ' + (o.garantia ? 'garantia até ' + fmtMesCurto(o.garantia) : 'garantia a definir') + '</div></div>' +
      '<button class="btn ghost" data-a="docs">Documentos (' + o.docs + ')</button><button class="btn ghost" data-a="com">Comentários</button>' + (o.estado === 'Em curso' ? '<button class="btn ambar" data-a="fim">Marcar como concluída</button>' : '') + '<button class="btn ghost" data-x style="border-color:transparent">Fechar</button>',
      function (el, fechar) {
        el.querySelector('[data-x]').onclick = fechar;
        el.querySelector('[data-a=docs]').onclick = function () { fechar(); docsFolha('Obra', o); };
        el.querySelector('[data-a=com]').onclick = function () { fechar(); comentariosFolha('Obra', o); };
        var fim = el.querySelector('[data-a=fim]');
        if (fim) fim.onclick = async function () {
          fechar();
          var v = await ask('Concluir obra', 'Podes acertar o custo final e a garantia.', [{ name: 'fim', label: 'Data de conclusão', type: 'date', value: hojeISO() }, { name: 'custo', label: 'Custo final (€)', value: o.custo == null ? '' : String(o.custo) }, { name: 'garantia', label: 'Garantia até (opcional)', type: 'month', value: o.garantia || '' }], 'Concluir');
          if (v && await acao(null, function () { return call('api_concluirObra', state.token, o.id, v.fim, v.custo, v.garantia); }, 'Obra concluída')) ecraObras();
        };
      });
  }
  function abrirProblema(p) {
    folha(p.titulo, '<div style="display:flex;flex-direction:column;gap:6px;font-size:14px">' + (p.descricao ? '<p>' + esc(p.descricao) + '</p>' : '') + '<div class="suave">' + esc(p.local) + ' · fração ' + esc(p.fracao) + ' · ' + haTempo(p.data) + '</div></div>' +
      '<div class="seg">' + ['Aberto', 'Em tratamento', 'Resolvido'].map(function (e) { return '<button data-e="' + e + '" aria-pressed="' + (p.estado === e) + '">' + e + '</button>'; }).join('') + '</div>' +
      '<button class="btn ghost" data-a="docs">Documentos (' + p.docs + ')</button><button class="btn ghost" data-a="com">Comentários (' + p.comentarios + ')</button><button class="btn ghost" data-x style="border-color:transparent">Fechar</button>',
      function (el, fechar) {
        el.querySelector('[data-x]').onclick = fechar;
        el.querySelector('[data-a=docs]').onclick = function () { fechar(); docsFolha('Problema', p); };
        el.querySelector('[data-a=com]').onclick = function () { fechar(); comentariosFolha('Problema', p); };
        Array.prototype.forEach.call(el.querySelectorAll('[data-e]'), function (b) { b.onclick = async function () { if (b.getAttribute('data-e') !== p.estado && await acao(b, function () { return call('api_setProblema', state.token, p.id, b.getAttribute('data-e')); }, 'Estado atualizado')) { fechar(); ecraObras(); } }; });
      });
  }
  async function docsFolha(tipo, reg) {
    var lista = [];
    try { lista = await call('api_docs', state.token, tipo, reg.id); } catch (e) { return toast(e.message, true); }
    folha('Documentos', (lista.length ? lista.map(function (d) { return '<div class="linha"><div class="grande" style="min-width:0"><div style="font-size:14px;font-weight:700;word-break:break-all">' + esc(d.nome) + '</div><div class="pequeno">' + fmtData(d.data) + ' · ' + esc(d.enviadoPor) + '</div></div><button class="btn ghost peq" data-d="' + esc(d.id) + '">Abrir</button></div>'; }).join('') : '<p class="suave">Ainda não há documentos.</p>') +
      '<button class="btn" data-a="add">Adicionar documento</button><button class="btn ghost" data-x style="border-color:transparent">Fechar</button>', function (el, fechar) {
      el.querySelector('[data-x]').onclick = fechar;
      Array.prototype.forEach.call(el.querySelectorAll('[data-d]'), function (b) { b.onclick = function () { descarregar(b, 'api_getDoc', b.getAttribute('data-d')); }; });

      };
    });
  }
  async function comentariosFolha(tipo, reg) {

    try { lista = await call('api_comments', state.token, tipo, reg.id); } catch (e) { return toast(e.message, true); }
    folha('Comentários', '<div style="max-height:40vh;overflow:auto;display:flex;flex-direction:column;gap:8px">' + (lista.length ? lista.map(function (c) { return '<div style="font-size:14px;line-height:1.4"><strong>' + (c.fracao ? 'Fração ' + esc(c.fracao) : esc(c.autor)) + '</strong> <span class="pequeno">' + haTempo(c.data) + '</span><br>' + esc(c.texto) + '</div>'; }).join('') : '<p class="suave">Sem comentários.</p>') + '</div>' +
      '<input id="txt" placeholder="Escreve um comentário" aria-label="Comentário"><button class="btn" data-a="ok">Comentar</button><button class="btn ghost" data-x style="border-color:transparent">Fechar</button>', function (el, fechar) {

    });
  }

  /* ---------- Resumo anual ---------- */
  async function ecraResumo() {
    var ano = Number(state.params.ano) || new Date().getFullYear();
    carregar('resumo' + ano, 'api_resumo', [ano], function (r) {
      vista('<main><header class="linha" style="justify-content:space-between;align-items:flex-start"><div><h1>Resumo anual</h1><p class="suave" style="margin-top:4px">Quanto cada fração pagou</p></div><button class="filtro" id="ano" style="min-height:40px;font-size:15px;font-weight:800;background:#fff">' + ano + ' ▾</button></header>' +
        '<div class="tres"><div class="kpi" style="background:var(--verde);color:#fff;border-color:var(--verde)"><div class="s1" style="color:#fff;opacity:.9">Cobrado</div><div class="k">' + eur(r.cobrado) + '</div></div><div class="kpi"><div class="s1">Em débito</div><div class="k" style="color:#B91C1C">' + eur(r.emDebito) + '</div></div><div class="kpi"><div class="s1">Em dia</div><div class="k">' + r.emDia + ' de ' + r.total + '</div></div></div>' +
        '<section class="cartao" style="padding:6px 14px 4px;gap:0"><div class="gr" style="font-size:12px;font-weight:700;color:var(--suave)"><span>Fr.</span><span>Pago</span><span style="text-align:right">Quota</span><span style="text-align:right">Em débito</span></div>' +
        r.linhas.map(function (l) {
          var pct = l.quota ? Math.min(100, Math.round(l.pago / l.quota * 100)) : 0;
          return '<div class="gr" style="border-top:1px solid #EFE9DD;align-items:center"><div class="tile" style="width:30px;height:30px;font-size:14px;border-radius:9px">' + esc(l.letra) + '</div><div style="display:flex;flex-direction:column;gap:4px;min-width:0"><span style="font-size:14px;font-weight:700">' + eur(l.pago) + '</span><div class="barra-p" style="height:6px;margin:0"><div style="width:' + pct + '%"></div></div></div>' +
            '<span style="text-align:right;font-size:13px;color:var(--suave)">' + (l.semQuota ? '—' : eur(l.quota)) + '</span><span style="text-align:right;font-size:13px;font-weight:700;color:' + (l.debito ? '#B91C1C' : 'var(--suave)') + '">' + (l.debito ? eur(l.debito) : '—') + '</span></div>';
        }).join('') + '</section><p class="pequeno">Quota = o que já devia estar pago até ao mês atual. Pagamentos de vários meses repartem-se por igual pelos meses.</p>' +
        '<div class="linha nao-imprimir"><button class="btn" id="pdf" style="flex:1;height:48px;font-size:14px">Exportar PDF</button><button class="btn ghost" id="csv" style="flex:1;height:48px;font-size:14px">Exportar CSV</button></div></main>', 'resumo');
      ligarGo();
      document.getElementById('ano').onclick = async function () {
        var anos = [], a0 = new Date().getFullYear(); for (var i = a0 + 1; i >= a0 - 5; i--) anos.push(String(i));
        var v = await ask('Escolher ano', '', [{ name: 'ano', label: 'Ano', options: anos, value: String(ano) }], 'Ver');
        if (v) go('resumo', { ano: Number(v.ano) });
      };
      document.getElementById('pdf').onclick = function () { window.print(); };
      document.getElementById('csv').onclick = function () {
        var linhas = [['Fracao', 'Nome', 'Quota_ate_hoje', 'Pago', 'Em_debito']].concat(r.linhas.map(function (l) { return [l.letra, l.nome, l.quota, l.pago, l.debito]; }));
        var csv = linhas.map(function (l) { return l.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(';'); }).join('\n');
        var url = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' }));
        var a = document.createElement('a'); a.href = url; a.download = 'resumo-' + ano + '.csv'; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      };
    });
  }

  async function ecraFracoes() {
    vista('<main>' + cabecalho('<h1>Frações</h1>') + '<p class="suave">A carregar…</p></main>', 'fracoes');
    try {
      var lista = await call('api_fracoes', state.token);
      vista('<main>' + cabecalho('') + '<div><h1>Frações</h1><p class="suave" style="margin-top:4px">' + (state.me.isMaster ? 'Escolhe a fração para corrigir os emails.' : 'Cada fração só altera os seus próprios emails.') + '</p></div>' +
        lista.map(function (f) { return '<button class="item" data-l="' + f.letra + '"><div class="letra ' + (f.minha ? 'sel' : '') + '">' + f.letra + '</div><div class="grande"><strong>' + esc(f.nome) + '</strong><div class="pequeno">' + (f.tipo === 'loja' ? 'Loja' : 'Habitação') + ' · ' + f.nEmails + ' de 2 emails</div></div>' + (f.minha ? '<span class="chip verde">A tua</span>' : '') + '</button>'; }).join('') + '</main>', 'fracoes');
      Array.prototype.forEach.call(document.querySelectorAll('[data-l]'), function (b) { b.onclick = function () { go('fracao', { letra: b.getAttribute('data-l') }); }; });
    } catch (e) { toast(e.message, true); if (/expirada/.test(e.message)) sair(true); }
  }

  async function ecraFracao() {
    var letra = state.params.letra;
    try {
      var d = await call('api_fracao', state.token, letra), m = state.me;
      vista('<main>' + cabecalho('') + '<div><button class="voltar" id="v">‹ Frações</button><div class="linha"><div class="letra sel" style="width:56px;height:56px;font-size:26px;border-radius:16px">' + esc(d.fracao.letra) + '</div><div><h1 style="font-size:24px">Fração ' + esc(d.fracao.letra) + ' · ' + esc(d.fracao.nome) + '</h1><p class="pequeno">' + (d.fracao.tipo === 'loja' ? 'Loja' : 'Habitação') + '</p></div></div></div>' +
        '<section class="cartao"><div class="linha" style="justify-content:space-between"><h2>Emails ativos</h2><span class="pequeno">' + d.ativos.length + ' de 2</span></div>' +
        d.ativos.map(function (e) { return '<div class="linha" style="border-top:1px solid #EFE9DD;padding-top:10px"><div class="grande"><div class="mail">' + esc(e.email) + '</div><div class="pequeno">Desde ' + fmtData(e.desde) + '</div></div>' + (d.podeEditar ? '<button class="btn ghost peq" data-trocar="' + esc(e.email) + '">Alterar</button>' + (d.ativos.length > 1 ? '<button class="btn perigo peq" data-rem="' + esc(e.email) + '">Remover</button>' : '') : '') + '</div>'; }).join('') +
        (d.podeEditar && d.podeAdicionar ? '<button class="btn ghost" id="add">Adicionar email</button>' : '') + '</section>' +
        '<div class="nota">' + (d.podeEditar ? (m.isMaster ? 'Como Admin Master tens de indicar um motivo. Todos são avisados.' : 'Só a tua fração pode alterar estes emails. Ao alterar, todos veem um aviso e fica registado quem o fez.') : 'Só a própria fração pode alterar os seus emails. Podes ver, mas não editar.') + '</div>' +
        '<section class="cartao"><h2>Histórico de emails</h2>' + d.historico.map(function (h) { return '<div class="linha" style="align-items:flex-start;padding-top:6px"><span style="width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:' + (h.ate ? '#B8AD96' : 'var(--verde)') + '"></span><div><div style="font-size:14px;font-weight:600;word-break:break-all">' + esc(h.email) + '</div><div class="pequeno">' + fmtData(h.desde) + (h.ate ? ' a ' + fmtData(h.ate) : ' até hoje') + ' · alterado por ' + esc(h.alteradoPor) + '</div></div></div>'; }).join('') + '</section></main>', 'fracoes');
      document.getElementById('v').onclick = function () { go('fracoes'); };
      var motivo = function () { return m.isMaster ? [{ name: 'motivo', label: 'Motivo (obrigatório)', placeholder: 'Ex.: fração vendida, sem acesso' }] : []; };
      var add = document.getElementById('add');
      if (add) add.onclick = async function () {
        var v = await ask('Adicionar email', 'Este email passa a poder entrar na app como fração ' + letra + '.', [{ name: 'email', label: 'Email', type: 'email', placeholder: 'novo@exemplo.pt' }].concat(motivo()), 'Adicionar');
        if (v && await acao(add, function () { return call('api_addEmail', state.token, letra, v.email, v.motivo || ''); }, 'Email adicionado')) ecraFracao();
      };
      Array.prototype.forEach.call(document.querySelectorAll('[data-trocar]'), function (b) { b.onclick = async function () {
        var antigo = b.getAttribute('data-trocar');
        var v = await ask('Alterar email', antigo + ' deixa de ter acesso. O histórico mantém o email antigo.', [{ name: 'novo', label: 'Novo email', type: 'email' }].concat(motivo()), 'Alterar');
        if (v && await acao(b, function () { return call('api_replaceEmail', state.token, letra, antigo, v.novo, v.motivo || ''); }, 'Email alterado')) { if (antigo === m.email) sair(true); else ecraFracao(); }
      }; });
      Array.prototype.forEach.call(document.querySelectorAll('[data-rem]'), function (b) { b.onclick = async function () {
        var email = b.getAttribute('data-rem');
        var v = await ask('Remover email', email + ' deixa de ter acesso à app.', motivo(), 'Remover', true);
        if (v && await acao(b, function () { return call('api_removeEmail', state.token, letra, email, v.motivo || ''); }, 'Email removido')) { if (email === m.email) sair(true); else ecraFracao(); }
      }; });
    } catch (e) { toast(e.message, true); if (/expirada/.test(e.message)) sair(true); else go('fracoes'); }
  }

  async function ecraPedidos() {
    try {
      var lista = await call('api_pendingRequests', state.token), m = state.me;
      vista('<main>' + cabecalho('') + '<div><h1>Pedidos de entrada</h1><p class="suave" style="margin-top:4px">' + (m.isMaster ? 'Só vês pedidos em impasse. O que decides fica no registo e todos são avisados.' : 'Pedidos para entrar na tua fração (' + esc(m.fracao) + '). Só quem já está nela decide.') + '</p></div>' +
        (lista.length ? lista.map(function (p) { return '<div class="cartao"><div class="linha"><div class="letra">' + esc(p.fracao) + '</div><div class="grande"><div class="mail">' + esc(p.email) + '</div><div class="pequeno">Fração ' + esc(p.fracao) + ' · ' + fmtQuando(p.data) + '</div></div></div>' + (p.motivoImpasse ? '<span class="chip aviso" style="align-self:flex-start">' + esc(p.motivoImpasse) + '</span>' : '') + '<div class="linha"><button class="btn perigo" data-no="' + p.id + '">Recusar</button><button class="btn" data-ok="' + p.id + '">Aprovar</button></div></div>'; }).join('') : '<div class="cartao centro"><p class="suave">Não há pedidos pendentes.</p></div>') +
        '<div class="nota"><span>' + (m.isMaster ? 'Aprovar ou recusar não altera mais nada. Para mudar emails de uma fração, usa Emails das frações.' : 'Se ninguém responder em 7 dias, o pedido passa para o Admin Master.') + '</span></div></main>', 'pedidos');
      var decidir = function (id, aprovar, btn) { return async function () {
        var v = m.isMaster ? await ask(aprovar ? 'Aprovar pedido' : 'Recusar pedido', '', [{ name: 'motivo', label: 'Motivo (obrigatório)' }], aprovar ? 'Aprovar' : 'Recusar', !aprovar) : {};
        if (v && await acao(btn, function () { return call('api_decideRequest', state.token, id, aprovar, v.motivo || ''); }, aprovar ? 'Pedido aprovado' : 'Pedido recusado')) { state.me = await call('api_me', state.token); ecraPedidos(); }
      }; };
      Array.prototype.forEach.call(document.querySelectorAll('[data-ok]'), function (b) { b.onclick = decidir(b.getAttribute('data-ok'), true, b); });
      Array.prototype.forEach.call(document.querySelectorAll('[data-no]'), function (b) { b.onclick = decidir(b.getAttribute('data-no'), false, b); });
    } catch (e) { toast(e.message, true); if (/expirada/.test(e.message)) sair(true); }
  }

  async function ecraAvisos() {
    try {
      var lista = await call('api_avisos', state.token), m = state.me;
      var temNovos = lista.some(function (a) { return !a.lido; });
      vista('<main>' + cabecalho('') + '<div class="linha" style="justify-content:space-between"><h1>Avisos</h1>' + (temNovos ? '<button class="voltar" id="lidos">Marcar tudo como lido</button>' : '') + '</div>' +
        (lista.length ? lista.map(function (a) { return '<div class="item' + (a.lido ? '' : ' nao-lido') + '" style="cursor:default;align-items:flex-start"><div class="grande"><div style="font-size:14px;font-weight:' + (a.lido ? 500 : 700) + ';line-height:1.35">' + esc(a.texto) + '</div><div class="pequeno" style="margin-top:2px">' + fmtQuando(a.data) + '</div></div>' + (a.lido ? '' : '<span style="width:9px;height:9px;border-radius:50%;background:var(--ambar);margin-top:6px;flex:none"></span>') + '</div>'; }).join('') : '<div class="cartao centro"><p class="suave">Sem avisos por agora.</p></div>') +
        '<p class="pequeno">Os avisos aparecem na app e não enchem o email. Só quem é diretamente afetado recebe também um email.</p></main>', 'avisos');
      var b = document.getElementById('lidos');
      if (b) b.onclick = async function () { if (await acao(b, function () { return call('api_markAvisosRead', state.token); })) { state.me = await call('api_me', state.token); ecraAvisos(); } };
    } catch (e) { toast(e.message, true); if (/expirada/.test(e.message)) sair(true); }
  }

  async function ecraDispositivos() {
    try {
      var lista = await call('api_devices', state.token), m = state.me;
      vista('<main>' + cabecalho('') + '<div><h1>Dispositivos ligados</h1><p class="suave" style="margin-top:4px">Onde tens sessão iniciada com ' + esc(m.email) + '. Se não reconheces algum, termina a sessão.</p></div>' +
        lista.map(function (d) { return '<div class="item" style="cursor:default;' + (d.revogado ? 'opacity:.55' : '') + '"><div class="grande"><strong>' + esc(d.nome) + '</strong><div class="pequeno">' + (d.este ? 'Ativo agora' : 'Último uso ' + fmtQuando(d.ultimoUso)) + '</div></div>' + (d.este ? '<span class="chip verde">Este</span>' : d.revogado ? '<span class="pequeno">Terminada</span>' : '<button class="btn perigo peq" data-end="' + d.id + '">Terminar</button>') + '</div>'; }).join('') +
        '<p class="pequeno">A sessão dura 6 meses em cada dispositivo (30 dias para o Admin Master) e renova sempre que a usas. Quando um dispositivo novo entra, a tua fração recebe um aviso.</p></main>', 'dispositivos');
      Array.prototype.forEach.call(document.querySelectorAll('[data-end]'), function (b) { b.onclick = async function () { if (await acao(b, function () { return call('api_endDevice', state.token, b.getAttribute('data-end')); }, 'Sessão terminada')) ecraDispositivos(); }; });
    } catch (e) { toast(e.message, true); if (/expirada/.test(e.message)) sair(true); }
  }

  /* ---------- arranque ---------- */
  function ecraManual() {
    var M = window.MANUAL, logado = !!state.me;
    var cab = logado ? cabecalho() : '<header class="topo"><div class="marca">Condomínio<br>Rua da Misericórdia 13/15/17</div></header>';
    var html = '<main class="manual">' + cab + '<button class="voltar nao-imprimir" id="v">‹ Voltar</button>' +
      '<div><h1 style="font-size:26px">Manual da app</h1><p class="pequeno" style="margin-top:4px">Versão ' + M.versao + ' · atualizado em ' + esc(new Date(M.atualizado + 'T12:00:00').toLocaleDateString('pt-PT')) + ' · descreve o que a app faz hoje</p></div>' +
      '<div class="nota verde nao-imprimir"><span>Este manual explica tudo, incluindo o que só o Admin Master faz, para que todos saibam o que cada um pode ou não pode fazer.</span></div>' +
      '<input id="q" class="nao-imprimir" type="search" placeholder="Pesquisar no manual…" aria-label="Pesquisar no manual">' +
      '<div class="indice nao-imprimir">' + M.secoes.map(function (x) { return '<button type="button" data-s="' + x.id + '">' + esc(x.titulo) + '</button>'; }).join('') + '</div>' +
      '<button class="btn ghost nao-imprimir" id="imp">Imprimir / guardar em PDF</button>' +
      M.secoes.map(function (x) { return '<section class="cartao" id="s-' + x.id + '" data-t="' + esc((x.titulo + ' ' + x.html.replace(/<[^>]+>/g, ' ')).toLowerCase()) + '"><h2 style="font-size:17px">' + esc(x.titulo) + '</h2><span style="display:flex;gap:6px;flex-wrap:wrap"><span class="chip">' + esc(x.quem) + '</span>' + (x.estado === 'breve' ? '<span class="chip aviso">Em breve na app</span>' : '') + '</span>' + x.html + '</section>'; }).join('') +
      '<p class="suave centro" id="nada" hidden>Nada encontrado.</p></main>';
    if (logado) vista(html, 'manual'); else app.innerHTML = html;
    if (logado) ligarBarra();
    document.getElementById('v').onclick = function () { go(logado ? 'inicio' : 'entrar'); };
    document.getElementById('imp').onclick = function () { window.print(); };
    document.getElementById('q').oninput = function () {
      var q = this.value.trim().toLowerCase(), n = 0;
      Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (e) { var v = !q || e.getAttribute('data-t').indexOf(q) >= 0; e.hidden = !v; if (v) n++; });
      document.getElementById('nada').hidden = n > 0;
    };
    Array.prototype.forEach.call(document.querySelectorAll('[data-s]'), function (b) { b.onclick = function () { var e = document.getElementById('s-' + b.getAttribute('data-s')); e.hidden = false; e.scrollIntoView({ behavior: 'smooth', block: 'start' }); }; });
  }

  function render() {
    var r = state.route;
    if (r === 'manual') return ecraManual();
    if (r === 'entrar') return ecraEntrar();
    if (r === 'pedir') return ecraPedir();
    if (r === 'quemes') return ecraQuemEs();
    if (r === 'inicio') return ecraInicio();
    if (r === 'fracoes') return ecraFracoes();
    if (r === 'fracao') return ecraFracao();
    if (r === 'pedidos') return ecraPedidos();
    if (r === 'avisos') return ecraAvisos();
    if (r === 'dispositivos') return ecraDispositivos();
    if (r === 'pagamentos') return ecraPagamentos();
    if (r === 'quotas') return ecraQuotas();
    if (r === 'recibos') return ecraRecibos();
    if (r === 'pagfracao') return ecraPagFracao();
    if (r === 'recibo') return ecraRecibo();
    if (r === 'recibosadmin') return ecraRecibosAdmin();
    if (r === 'administracao') return ecraAdministracao();
    if (r === 'convocatoria') return ecraConvocatoria();
    if (r === 'obras') return ecraObras();
    if (r === 'resumo') return ecraResumo();
    app.innerHTML = '<main style="padding-top:80px"><p class="suave">A carregar…</p></main>';
  }

  async function arrancar() {
    state.token = state.token || load('token');
    if (!state.token) { state.tmp = {}; return go('entrar'); }
    try {
      // pedidos em paralelo: o início e o mês atual já vêm a caminho enquanto confirmamos a sessão
      var cur = mesAtualNum();
      call('api_home', state.token).then(function (v) { cache.home = { v: v }; }).catch(function () {});
      call('api_pagamentosMes', state.token, cur.ano, cur.mes).then(function (v) { cache['pagm' + cur.ano + '-' + cur.mes] = { v: v }; }).catch(function () {});
      state.me = await call('api_me', state.token);
      state.tmp = {};
      go(state.me.needsWho ? 'quemes' : (state.route === 'boot' || state.route === 'entrar' || state.route === 'quemes' ? 'inicio' : state.route), state.params);
    } catch (e) { store('token', null); state.token = null; go('entrar'); }
  }

  render();
  arrancar();
})();
</script>
</body>
</html>
